<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerf-ATG Debug Console</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .debug-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .debug-header h1 {
            font-size: 1.5rem;
            color: #e74c3c;
        }
        .debug-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .debug-controls button {
            padding: 8px 16px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #eee;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .debug-controls button:hover {
            background: #3a3a3a;
        }
        .debug-controls button.active {
            background: #e74c3c;
            border-color: #e74c3c;
        }
        .debug-controls label {
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .debug-controls input[type="checkbox"] {
            accent-color: #e74c3c;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 14px;
        }
        .stat-card .label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 1.3rem;
            font-weight: 600;
            color: #eee;
            margin-top: 4px;
        }
        .stat-card .value.ok { color: #2ecc71; }
        .stat-card .value.warn { color: #f39c12; }
        .stat-card .value.err { color: #e74c3c; }
        .log-viewer {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            max-height: 600px;
            overflow-y: auto;
            overflow-x: auto;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .log-line {
            display: flex;
            gap: 8px;
            padding: 2px 0;
            border-bottom: 1px solid #1a1a1a;
            white-space: nowrap;
            width: max-content;
            min-width: 100%;
        }
        .log-line:hover { background: #1a1a1a; }
        .log-time {
            color: #666;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 70px;
        }
        .log-level {
            font-weight: 600;
            min-width: 60px;
        }
        .log-level.INFO { color: #3498db; }
        .log-level.WARNING { color: #f39c12; }
        .log-level.SEVERE { color: #e74c3c; }
        .log-level.ERROR { color: #e74c3c; }
        .log-logger {
            color: #9b59b6;
            flex-shrink: 0;
            white-space: nowrap;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .log-msg {
            color: #ccc;
            white-space: nowrap;
        }
        .log-thrown {
            color: #e74c3c;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 4px;
            padding-left: 20px;
            border-left: 2px solid #e74c3c;
        }
        .back-link {
            color: #aaa;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover { color: #eee; }
    </style>
</head>
<body>
    <div class="debug-container">
        <div class="debug-header">
            <div>
                <h1>🐛 Debug Console</h1>
                <a href="/" class="back-link">← Back to Dashboard</a>
            </div>
            <div class="debug-controls">
                <label><input type="checkbox" id="autoscroll" checked> Auto-scroll</label>
                <label><input type="checkbox" id="autorefresh" checked> Auto-refresh (2s)</label>
                <button id="clearBtn" onclick="clearLogs()">Clear</button>
                <button id="pauseBtn" onclick="togglePause()">Pause</button>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="label">Uptime</div><div class="value" id="stat-uptime">—</div></div>
            <div class="stat-card"><div class="label">TCP Connections</div><div class="value" id="stat-conn-cur">—</div></div>
            <div class="stat-card"><div class="label">Total Connects</div><div class="value" id="stat-conn-total">—</div></div>
            <div class="stat-card"><div class="label">Packets In</div><div class="value" id="stat-pkts-in">—</div></div>
            <div class="stat-card"><div class="label">Packets Out</div><div class="value" id="stat-pkts-out">—</div></div>
            <div class="stat-card"><div class="label">Used Memory</div><div class="value" id="stat-mem-used">—</div></div>
            <div class="stat-card"><div class="label">Free Memory</div><div class="value" id="stat-mem-free">—</div></div>
            <div class="stat-card"><div class="label">Max Memory</div><div class="value" id="stat-mem-max">—</div></div>
            <div class="stat-card"><div class="label">Threads</div><div class="value" id="stat-threads">—</div></div>
            <div class="stat-card"><div class="label">CPUs</div><div class="value" id="stat-cpus">—</div></div>
            <div class="stat-card"><div class="label">Games</div><div class="value" id="stat-games">—</div></div>
            <div class="stat-card"><div class="label">Players In-Game</div><div class="value" id="stat-players-in">—</div></div>
            <div class="stat-card"><div class="label">Players Lobby</div><div class="value" id="stat-players-out">—</div></div>
        </div>

        <div class="log-viewer" id="logViewer">
            <div style="color:#666;text-align:center;padding:40px">Loading logs...</div>
        </div>
    </div>

    <script>
        let paused = false;
        let lastLogCount = 0;

        async function fetchLogs() {
            if (paused) return;
            try {
                const resp = await fetch('/api/debug/logs');
                const logs = await resp.json();
                renderLogs(logs);
            } catch (e) {
                console.error('Failed to fetch logs:', e);
            }
        }

        async function fetchStatus() {
            try {
                const resp = await fetch('/api/debug/status');
                const s = await resp.json();
                const fmtMB = (b) => (b / 1048576).toFixed(1) + ' MB';
                const fmtUptime = (ms) => {
                    const seconds = Math.floor(ms / 1000);
                    const days = Math.floor(seconds / 86400);
                    const hours = Math.floor((seconds % 86400) / 3600);
                    const minutes = Math.floor((seconds % 3600) / 60);
                    const secs = seconds % 60;
                    if (days > 0) return `${days}d ${hours}h ${minutes}m ${secs}s`;
                    if (hours > 0) return `${hours}h ${minutes}m ${secs}s`;
                    if (minutes > 0) return `${minutes}m ${secs}s`;
                    return `${secs}s`;
                };

                document.getElementById('stat-uptime').textContent = fmtUptime(s.uptimeMs);
                document.getElementById('stat-conn-cur').textContent = s.currentConnections;
                document.getElementById('stat-conn-total').textContent = s.totalConnections;
                document.getElementById('stat-pkts-in').textContent = s.packetsReceived;
                document.getElementById('stat-pkts-out').textContent = s.packetsSent;

                const used = document.getElementById('stat-mem-used');
                used.textContent = fmtMB(s.usedMemory);
                used.className = 'value ' + (s.usedMemory > s.maxMemory * 0.8 ? 'err' : s.usedMemory > s.maxMemory * 0.6 ? 'warn' : 'ok');

                document.getElementById('stat-mem-free').textContent = fmtMB(s.freeMemory);
                document.getElementById('stat-mem-max').textContent = fmtMB(s.maxMemory);

                const threads = document.getElementById('stat-threads');
                threads.textContent = s.threadCount;
                threads.className = 'value ' + (s.threadCount > 100 ? 'warn' : 'ok');

                document.getElementById('stat-cpus').textContent = s.processors;
                document.getElementById('stat-games').textContent = s.gameCount;
                document.getElementById('stat-players-in').textContent = s.playersInGame;
                document.getElementById('stat-players-out').textContent = s.playersNotInGame;
            } catch (e) {
                console.error('Failed to fetch status:', e);
            }
        }

        function renderLogs(logs) {
            const viewer = document.getElementById('logViewer');
            const wasNearBottom = viewer.scrollTop + viewer.clientHeight >= viewer.scrollHeight - 50;
            const autoScroll = document.getElementById('autoscroll').checked;

            if (logs.length === 0) {
                viewer.innerHTML = '<div style="color:#666;text-align:center;padding:40px">No logs yet. Logs will appear here as the server runs.</div>';
                return;
            }

            // Only re-render if new logs
            if (logs.length === lastLogCount) return;
            lastLogCount = logs.length;

            let html = '';
            for (const log of logs) {
                const time = new Date(log.timestamp).toLocaleTimeString('en-GB', { hour12: false });
                const levelClass = log.level || 'INFO';
                const thrown = log.thrown ? '<div class="log-thrown">' + escapeHtml(log.thrown) + '</div>' : '';
                html += '<div class="log-line">'
                    + '<span class="log-time">' + time + '</span>'
                    + '<span class="log-level ' + levelClass + '">' + log.level + '</span>'
                    + '<span class="log-logger">' + escapeHtml(log.logger || '') + '</span>'
                    + '<span class="log-msg">' + escapeHtml(log.message || '') + thrown + '</span>'
                    + '</div>';
            }
            viewer.innerHTML = html;

            if (autoScroll && wasNearBottom) {
                viewer.scrollTop = viewer.scrollHeight;
            }
        }

        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function clearLogs() {
            document.getElementById('logViewer').innerHTML = '<div style="color:#666;text-align:center;padding:40px">Logs cleared (local view only)</div>';
            lastLogCount = 0;
        }

        function togglePause() {
            paused = !paused;
            const btn = document.getElementById('pauseBtn');
            btn.textContent = paused ? 'Resume' : 'Pause';
            btn.classList.toggle('active', paused);
        }

        // Initial fetch
        fetchLogs();
        fetchStatus();

        // Auto-refresh
        setInterval(() => {
            if (document.getElementById('autorefresh').checked && !paused) {
                fetchLogs();
                fetchStatus();
            }
        }, 2000);
    </script>
</body>
</html>
