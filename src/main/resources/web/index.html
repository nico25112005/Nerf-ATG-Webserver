<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nerf-ATG Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="logo">Nerf-ATG</span>
        <span class="subtitle">Live Game Dashboard</span>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">🌙</button>
      </div>
    </header>

    <main class="home-main">
      <section class="hero">
        <h1>Active Games</h1>
        <p>Choose a game to view live player positions, bases, and stats.</p>
      </section>

      <section id="games-container" class="games-grid">
        <div class="loading">Loading games…</div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Auto-refreshes every 2 seconds</span>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
